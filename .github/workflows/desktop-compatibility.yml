name: Windows and Linux desktop compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth libnotify-bin espeak-ng
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Linux GUI and application tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m unittest discover -s tests -v
      - name: Linux native application smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B scripts/desktop_smoke.py
      - name: Windows GUI and application tests
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -v
      - name: Windows native application smoke test
        if: runner.os == 'Windows'
        run: python -B scripts/desktop_smoke.py
      - name: Build Windows executable
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm main.spec
      - name: Upload Windows build
        if: runner.os == 'Windows' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: stormwatch-windows
          path: dist/main.exe
